<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>invader</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="root" class="mono"></span>
    <span id="strip" aria-label="Status"></span>
    <span id="note" class="muted"></span>
    <button id="map-ask" type="button">Build map</button>
    <button id="open" type="button">Open folder…</button>
    <button id="term-toggle" type="button">Hide terminal</button>
  </header>
  <main>
    <section id="left">
      <div id="changes" aria-label="Changed files"></div>
      <div id="tree" aria-label="Folder contents"></div>
    </section>
    <section id="file" aria-label="File">
      <div id="file-head"></div>
      <div id="file-body"></div>
    </section>
    <section id="terminal" aria-label="Terminal">
      <div id="term"></div>
      <button id="term-open" type="button">Terminal</button>
    </section>
  </main>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
